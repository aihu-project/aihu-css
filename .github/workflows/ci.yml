name: CSS engine CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify CSS engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable toolchain action
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: cargo test
      - run: bun run build:rust
      - run: bun run gen:animations-gallery
      - run: git diff --exit-code -- gallery src/runtime/cn-conflict-map.generated.ts styles
      - run: bun run check:lint
      - run: bun run typecheck
      - run: bun run check:platform-pins
      - run: bun run test
      - run: bun run check:cn-map
      - run: bun run check:animations-gallery
      - run: bun run build
      - name: Pack and consume exact artifact
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/aihu-css-ci-pack"
          PACK_DIR="$pack_dir" node scripts/verify-pack.mjs
          pack_path=$(node -e "const fs=require('node:fs'),path=require('node:path'); const d=process.argv[1]; const xs=fs.readdirSync(d).filter((x)=>x.endsWith('.tgz')); if(xs.length!==1) process.exit(1); process.stdout.write(path.join(d,xs[0]))" "$pack_dir")
          node scripts/consumer-smoke.mjs "$pack_path"
